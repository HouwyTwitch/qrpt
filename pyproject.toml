[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qrpt"
version = "0.1.0"
description = "Post-quantum crypto toolkit (ML-KEM/ML-DSA + AES-GCM)"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=42.0.0",
  "oqs>=0.10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
